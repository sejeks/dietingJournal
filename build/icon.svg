<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd47a"/>
      <stop offset="1" stop-color="#0f8a4a"/>
    </linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#d42a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e2b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style rounded tile (824px on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- subtle top highlight -->


  <!-- calorie goal ring: track + ~75% progress -->
  <circle cx="512" cy="530" r="290" fill="none" stroke="#0a5c32" stroke-opacity="0.45" stroke-width="58"/>
  <circle cx="512" cy="530" r="290" fill="none" stroke="#fde047" stroke-width="58"
          stroke-linecap="round" stroke-dasharray="1366 1822"
          transform="rotate(-90 512 530)" filter="url(#soft)"/>

  <!-- apple -->
  <g filter="url(#soft)">
    <path fill="url(#apple)" d="
      M512 438
      C470 404 392 402 352 452
      C306 510 318 608 362 668
      C392 710 430 736 466 732
      C486 730 498 720 512 720
      C526 720 538 730 558 732
      C594 736 632 710 662 668
      C706 608 718 510 672 452
      C632 402 554 404 512 438 Z"/>
    <!-- stem -->
    <path d="M512 440 C510 410 516 384 532 362" fill="none" stroke="#7c4a1e" stroke-width="20" stroke-linecap="round"/>
    <!-- leaf -->
    <path fill="#0b6b37" d="M540 378 C566 330 628 318 664 330 C648 372 596 400 540 378 Z"/>
  </g>
  <!-- shine on apple -->
  <path d="M378 520 C380 488 398 466 420 456" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
